[package]
name = "insta-rust"
description = "Bare-metal real-time Rust runtime on Windows Hypervisor Platform."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
addr2line = { version = "0.27", default-features = false, features = ["std", "rustc-demangle"] }
gimli = { version = "0.34", default-features = false, features = ["read", "std"] }
object = { version = "0.41", default-features = false, features = ["read_core", "elf"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Hypervisor",
    "Win32_System_Memory",
] }

[lints]
workspace = true
